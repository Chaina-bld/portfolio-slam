  </head>
  <body>
    <header class="header-pages">
      <h1 class="header-title">Chaina BELIDA</h1>

      <button class="burger-menu" id="burger-menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="nav" id="nav-menu">
        <a href="../index.html" class="nav-link active">
          <i data-lucide="house" width="18"></i>
          <p>Accueil</p>
        </a>
        <a href="../pages/works.html" class="nav-link">
          <i data-lucide="graduation-cap" width="18"></i>
          <p>Ecole & Entreprise</p>
        </a>
        <a href="../pages/bts.html" class="nav-link">
          <i data-lucide="backpack" width="18"></i>
          <p>BTS SIO</p>
        </a>
        <a href="../pages/e5.html" class="nav-link">
          <i data-lucide="list-check" width="18"></i>
          <p>Mission E5</p>
        </a>
        <a href="../pages/e6.html" class="nav-link">
          <i data-lucide="folder" width="18"></i>

        <a href="../pages/veille.html" class="nav-link">

        <a href="../pages/contact.html" class="nav-link active">
          <i data-lucide="contact" width="18"></i>
          <p>Contact</p>
        </a>
      </nav>
    </header>

    <main class="screen-main">
      <section class="contact">
        <div class="contact-card">
          <h2>Formulaire de contact</h2>
          <form
            class="form-contact"
            action="https://formspree.io/f/mzdgeeje"
            method="POST"
          >
            <div class="form-grid-group">
              <div class="form-group">
                <label for="name">Nom</label>
                <input
                  type="text"
                  id="name"
                  name="name"
                  placeholder="Votre Nom"
                  required
                />
              </div>
              <div class="form-group">
                <label for="prenom">Prénom</label>
                <input
                  type="text"
                  id="prenom"
                  name="prenom"
                  placeholder="Votre Prénom"
                  required
                />
              </div>
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Votre Email"
                required
              />
            </div>
            <div class="form-group">
              <label for="message">Message</label>
              <textarea
                id="message"
                name="message"
                rows="5"
                placeholder="Votre message ..."
                required
              ></textarea>
            </div>
            <button type="submit" class="button-card">Envoyer</button>
          </form>
        </div>
      </section>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
    <script src="../script.js"></script>
  </body>
</html>
